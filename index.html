<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --panel: rgba(255, 255, 255, 0.9);
        --panel-strong: #ffffff;
        --surface: #edf3ff;
        --surface-strong: #dfeaff;
        --card: #ffffff;
        --card-muted: #f8fafc;
        --text: #18212f;
        --text-soft: #5c6474;
        --border: rgba(148, 163, 184, 0.25);
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        --shadow-soft: 0 6px 18px rgba(15, 23, 42, 0.06);
        --primary: #3b82f6;
        --primary-strong: #2563eb;
        --todo: #60a5fa;
        --doing: #fbbf24;
        --done: #34d399;
        --danger: #ef4444;
        --danger-soft: rgba(239, 68, 68, 0.12);
        --overlay: rgba(15, 23, 42, 0.42);
        --focus: rgba(59, 130, 246, 0.22);
      }

      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: rgba(15, 23, 42, 0.82);
        --panel-strong: #111827;
        --surface: #111c2f;
        --surface-strong: #1a2942;
        --card: #111827;
        --card-muted: #0f172a;
        --text: #e5edf8;
        --text-soft: #aab7c8;
        --border: rgba(148, 163, 184, 0.18);
        --shadow: 0 10px 30px rgba(2, 6, 23, 0.4);
        --shadow-soft: 0 6px 18px rgba(2, 6, 23, 0.28);
        --primary: #60a5fa;
        --primary-strong: #3b82f6;
        --todo: #60a5fa;
        --doing: #fbbf24;
        --done: #34d399;
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.14);
        --overlay: rgba(2, 6, 23, 0.7);
        --focus: rgba(96, 165, 250, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        transition: background-color 0.25s ease, color 0.25s ease;
      }

      button, input, textarea {
        font: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .app {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px 20px 40px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        color: #fff;
        font-size: 1.4rem;
        box-shadow: var(--shadow-soft);
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2rem);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .ghost-button,
      .primary-button,
      .icon-button,
      .delete-button,
      .move-button {
        border: 1px solid transparent;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      }

      .ghost-button,
      .primary-button {
        padding: 0.8rem 1.1rem;
        font-weight: 600;
      }

      .ghost-button {
        background: var(--panel);
        color: var(--text);
        border-color: var(--border);
        box-shadow: var(--shadow-soft);
      }

      .primary-button {
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: #fff;
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.25);
      }

      .ghost-button:hover,
      .primary-button:hover,
      .icon-button:hover,
      .delete-button:hover,
      .move-button:hover {
        transform: translateY(-1px);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, minmax(240px, 1fr));
        gap: 20px;
        align-items: start;
      }

      .column {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow-soft);
        padding: 16px 14px 14px;
        min-height: 420px;
      }

      .column-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        padding: 0 6px 8px;
      }

      .column-title-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.02);
      }

      .status-todo { background: var(--todo); }
      .status-doing { background: var(--doing); }
      .status-done { background: var(--done); }

      .column-title {
        margin: 0;
        font-size: 1.02rem;
        font-weight: 700;
      }

      .count-badge {
        min-width: 32px;
        height: 32px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        font-weight: 700;
        border: 1px solid var(--border);
      }

      .task-list {
        min-height: 220px;
        border-radius: 16px;
        padding: 4px;
        transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        border: 1.5px dashed transparent;
      }

      .task-list.drop-target {
        background: rgba(59, 130, 246, 0.06);
        border-color: rgba(59, 130, 246, 0.45);
        box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.2);
      }

      .task-list-empty {
        display: grid;
        place-items: center;
        min-height: 110px;
        padding: 18px 12px;
        color: var(--text-soft);
        background: rgba(148, 163, 184, 0.04);
        border: 1px dashed var(--border);
        border-radius: 14px;
        text-align: center;
        font-size: 0.95rem;
      }

      .task-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow-soft);
        padding: 14px 12px 12px;
        margin-bottom: 12px;
        cursor: grab;
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }

      .task-card:last-child {
        margin-bottom: 0;
      }

      .task-card:hover {
        box-shadow: var(--shadow);
      }

      .task-card.dragging {
        opacity: 0.5;
        transform: rotate(2deg) scale(0.98);
      }

      .task-card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .task-card h3 {
        margin: 0;
        font-size: 1rem;
        line-height: 1.4;
        word-break: break-word;
      }

      .delete-button {
        width: 32px;
        height: 32px;
        border: 1px solid var(--border);
        background: var(--card-muted);
        color: var(--text-soft);
        font-size: 1.1rem;
        line-height: 1;
      }

      .delete-button:hover {
        background: var(--danger-soft);
        border-color: rgba(239, 68, 68, 0.25);
        color: var(--danger);
      }

      .task-description {
        margin: 10px 0 12px;
        color: var(--text-soft);
        font-size: 0.93rem;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .task-card-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .move-group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .move-button {
        width: 34px;
        height: 34px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 1.2rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .move-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .meta-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.38rem 0.7rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        background: rgba(59, 130, 246, 0.08);
        color: var(--primary-strong);
        border: 1px solid rgba(59, 130, 246, 0.12);
      }

      .modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--overlay);
        z-index: 50;
        padding: 20px;
      }

      .modal.open {
        display: flex;
      }

      .modal-panel {
        position: relative;
        width: min(100%, 560px);
        background: var(--panel-strong);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 26px 22px 20px;
      }

      .modal-close {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-soft);
        font-size: 1.4rem;
      }

      .modal h2 {
        margin: 0 0 8px;
        font-size: clamp(1.4rem, 3vw, 1.8rem);
      }

      .modal-subtitle {
        margin: 0 0 18px;
        color: var(--text-soft);
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }

      .field-group label {
        font-weight: 600;
      }

      .field-group input,
      .field-group textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        padding: 0.85rem 0.9rem;
        resize: vertical;
        min-height: 48px;
      }

      .field-group textarea {
        min-height: 120px;
      }

      .field-error {
        min-height: 1.2rem;
        color: #ef4444;
        font-size: 0.83rem;
        margin-top: -6px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 10px;
      }

      .secondary-button {
        padding: 0.8rem 1.1rem;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-weight: 600;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .board {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar" aria-label="Cabeçalho do quadro Kanban">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">✓</div>
          <h1>Kanban Board</h1>
        </div>

        <div class="toolbar">
          <button id="themeToggle" class="ghost-button" type="button" aria-label="Alternar tema do painel" aria-pressed="false">
            🌙 Escuro
          </button>
          <button id="addTaskBtn" class="primary-button" type="button" aria-label="Adicionar nova tarefa">
            + Adicionar nova tarefa
          </button>
        </div>
      </header>

      <main class="board" aria-label="Colunas do Kanban">
        <section class="column" aria-labelledby="todo-heading">
          <div class="column-header">
            <div class="column-title-wrap">
              <span class="status-indicator status-todo" aria-hidden="true"></span>
              <h2 id="todo-heading" class="column-title">A Fazer</h2>
            </div>
            <span id="count-todo" class="count-badge" aria-live="polite">0</span>
          </div>
          <div class="task-list" data-status="todo" aria-label="Lista de tarefas a fazer"></div>
        </section>

        <section class="column" aria-labelledby="doing-heading">
          <div class="column-header">
            <div class="column-title-wrap">
              <span class="status-indicator status-doing" aria-hidden="true"></span>
              <h2 id="doing-heading" class="column-title">Em Andamento</h2>
            </div>
            <span id="count-doing" class="count-badge" aria-live="polite">0</span>
          </div>
          <div class="task-list" data-status="doing" aria-label="Lista de tarefas em andamento"></div>
        </section>

        <section class="column" aria-labelledby="done-heading">
          <div class="column-header">
            <div class="column-title-wrap">
              <span class="status-indicator status-done" aria-hidden="true"></span>
              <h2 id="done-heading" class="column-title">Concluído</h2>
            </div>
            <span id="count-done" class="count-badge" aria-live="polite">0</span>
          </div>
          <div class="task-list" data-status="done" aria-label="Lista de tarefas concluídas"></div>
        </section>
      </main>
    </div>

    <div id="taskModal" class="modal" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button id="closeModalBtn" class="modal-close" type="button" aria-label="Fechar modal">×</button>

        <h2 id="modalTitle">Adicionar nova tarefa</h2>
        <p class="modal-subtitle">Crie uma atividade e envie para a coluna de início.</p>

        <form id="taskForm" novalidate>
          <div class="field-group">
            <label for="taskTitle">Título</label>
            <input id="taskTitle" name="taskTitle" type="text" maxlength="120" placeholder="Ex.: Revisar briefing do projeto" aria-describedby="taskTitleError" required />
            <div id="taskTitleError" class="field-error" role="alert" aria-live="assertive"></div>
          </div>

          <div class="field-group">
            <label for="taskDescription">Descrição</label>
            <textarea id="taskDescription" name="taskDescription" maxlength="600" placeholder="Descreva os detalhes da atividade (opcional)"></textarea>
          </div>

          <div class="modal-actions">
            <button id="cancelTaskBtn" class="secondary-button" type="button">Cancelar</button>
            <button class="primary-button" type="submit">Salvar tarefa</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      // Persistência
      const STORAGE_KEY = 'kanban-board-v1';
      const THEME_KEY = 'kanban-board-theme';
      const statusOrder = ['todo', 'doing', 'done'];

      const defaultTasks = [
        {
          id: 'sample-1',
          title: 'Revisar o briefing do cliente',
          description: 'Confirmar requisitos, prazos e entregáveis antes da primeira reunião.',
          status: 'todo'
        },
        {
          id: 'sample-2',
          title: 'Preparar protótipo da homepage',
          description: 'Definir estrutura visual e esquema de navegação principal.',
          status: 'doing'
        }
      ];

      let tasks = [];
      let draggedTaskId = null;
      let themePreference = 'system';

      const taskListEls = Array.from(document.querySelectorAll('.task-list'));
      const modalEl = document.getElementById('taskModal');
      const taskForm = document.getElementById('taskForm');
      const taskTitleInput = document.getElementById('taskTitle');
      const taskDescriptionInput = document.getElementById('taskDescription');
      const titleErrorEl = document.getElementById('taskTitleError');
      const themeToggleBtn = document.getElementById('themeToggle');
      const addTaskBtn = document.getElementById('addTaskBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const cancelTaskBtn = document.getElementById('cancelTaskBtn');

      function safeStorageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch (error) {
          console.warn('Não foi possível acessar o localStorage:', error);
          return null;
        }
      }

      function safeStorageSet(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (error) {
          console.warn('Não foi possível salvar no localStorage:', error);
        }
      }

      function createTaskId() {
        if (window.crypto && typeof crypto.randomUUID === 'function') {
          return crypto.randomUUID();
        }

        return `task-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function loadTasks() {
        const raw = safeStorageGet(STORAGE_KEY);

        if (!raw) {
          tasks = defaultTasks.map((task) => ({ ...task }));
          saveTasks();
          return tasks;
        }

        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length) {
            tasks = parsed;
            return tasks;
          }

          tasks = defaultTasks.map((task) => ({ ...task }));
          saveTasks();
          return tasks;
        } catch (error) {
          console.warn('Dados de tarefas inválidos no localStorage:', error);
          tasks = defaultTasks.map((task) => ({ ...task }));
          saveTasks();
          return tasks;
        }
      }

      function saveTasks() {
        const payload = JSON.stringify(tasks);
        safeStorageSet(STORAGE_KEY, payload);
      }

      function loadThemePreference() {
        const storedTheme = safeStorageGet(THEME_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (storedTheme === 'light' || storedTheme === 'dark') {
          themePreference = storedTheme;
        } else {
          themePreference = prefersDark ? 'dark' : 'light';
        }

        applyTheme(themePreference);
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themePreference = theme;
        safeStorageSet(THEME_KEY, theme);

        const isDark = theme === 'dark';
        themeToggleBtn.setAttribute('aria-pressed', String(isDark));
        themeToggleBtn.textContent = isDark ? '☀️ Claro' : '🌙 Escuro';
        themeToggleBtn.setAttribute('aria-label', isDark ? 'Ativar tema claro' : 'Ativar tema escuro');
      }

      function openModal() {
        modalEl.classList.add('open');
        modalEl.setAttribute('aria-hidden', 'false');
        requestAnimationFrame(() => taskTitleInput.focus());
      }

      function closeModal() {
        modalEl.classList.remove('open');
        modalEl.setAttribute('aria-hidden', 'true');
        taskForm.reset();
        titleErrorEl.textContent = '';
      }

      function showTitleError(message) {
        titleErrorEl.textContent = message;
        taskTitleInput.setAttribute('aria-invalid', 'true');
        taskTitleInput.focus();
      }

      function clearTitleError() {
        titleErrorEl.textContent = '';
        taskTitleInput.removeAttribute('aria-invalid');
      }

      function getTaskById(taskId) {
        return tasks.find((task) => task.id === taskId);
      }

      function updateTaskStatus(taskId, nextStatus) {
        tasks = tasks.map((task) => {
          if (task.id !== taskId) {
            return task;
          }

          return { ...task, status: nextStatus };
        });

        saveTasks();
        renderBoard();
      }

      function deleteTask(taskId) {
        tasks = tasks.filter((task) => task.id !== taskId);
        saveTasks();
        renderBoard();
      }

      function buildPlaceholder() {
        const placeholder = document.createElement('div');
        placeholder.className = 'task-list-empty';
        placeholder.textContent = 'Nenhuma tarefa aqui.';
        return placeholder;
      }

      function createTaskCard(task) {
        const card = document.createElement('article');
        card.className = 'task-card';
        card.draggable = true;
        card.dataset.id = task.id;
        card.setAttribute('aria-label', `Tarefa: ${task.title}`);

        const cardHeader = document.createElement('div');
        cardHeader.className = 'task-card-header';

        const title = document.createElement('h3');
        title.textContent = task.title;

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'delete-button';
        deleteButton.setAttribute('aria-label', `Excluir tarefa ${task.title}`);
        deleteButton.textContent = '×';
        deleteButton.addEventListener('click', () => deleteTask(task.id));

        cardHeader.appendChild(title);
        cardHeader.appendChild(deleteButton);

        const description = document.createElement('p');
        description.className = 'task-description';
        description.textContent = task.description && task.description.trim() ? task.description : 'Sem descrição.';

        const actionRow = document.createElement('div');
        actionRow.className = 'task-card-actions';

        const moveGroup = document.createElement('div');
        moveGroup.className = 'move-group';

        const leftButton = document.createElement('button');
        leftButton.type = 'button';
        leftButton.className = 'move-button';
        leftButton.setAttribute('aria-label', `Mover tarefa ${task.title} para a coluna anterior`);
        leftButton.textContent = '‹';
        leftButton.disabled = task.status === statusOrder[0];
        leftButton.addEventListener('click', () => {
          const currentIndex = statusOrder.indexOf(task.status);
          if (currentIndex > 0) {
            updateTaskStatus(task.id, statusOrder[currentIndex - 1]);
          }
        });

        const rightButton = document.createElement('button');
        rightButton.type = 'button';
        rightButton.className = 'move-button';
        rightButton.setAttribute('aria-label', `Mover tarefa ${task.title} para a próxima coluna`);
        rightButton.textContent = '›';
        rightButton.disabled = task.status === statusOrder[statusOrder.length - 1];
        rightButton.addEventListener('click', () => {
          const currentIndex = statusOrder.indexOf(task.status);
          if (currentIndex < statusOrder.length - 1) {
            updateTaskStatus(task.id, statusOrder[currentIndex + 1]);
          }
        });

        const metaBadge = document.createElement('span');
        metaBadge.className = 'meta-badge';
        metaBadge.textContent = task.status === 'todo' ? 'A fazer' : task.status === 'doing' ? 'Andamento' : 'Concluído';

        moveGroup.appendChild(leftButton);
        moveGroup.appendChild(rightButton);
        actionRow.appendChild(moveGroup);
        actionRow.appendChild(metaBadge);

        card.appendChild(cardHeader);
        card.appendChild(description);
        card.appendChild(actionRow);

        card.addEventListener('dragstart', (event) => {
          draggedTaskId = task.id;
          card.classList.add('dragging');
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', task.id);
        });

        card.addEventListener('dragend', () => {
          draggedTaskId = null;
          card.classList.remove('dragging');
          taskListEls.forEach((column) => column.classList.remove('drop-target'));
        });

        return card;
      }

      function renderBoard() {
        const grouped = {
          todo: [],
          doing: [],
          done: []
        };

        tasks.forEach((task) => {
          if (grouped[task.status]) {
            grouped[task.status].push(task);
          }
        });

        taskListEls.forEach((list) => {
          const status = list.dataset.status;
          const statusTasks = grouped[status] || [];
          list.innerHTML = '';

          if (!statusTasks.length) {
            list.appendChild(buildPlaceholder());
          } else {
            statusTasks.forEach((task) => {
              list.appendChild(createTaskCard(task));
            });
          }
        });

        document.getElementById('count-todo').textContent = grouped.todo.length;
        document.getElementById('count-doing').textContent = grouped.doing.length;
        document.getElementById('count-done').textContent = grouped.done.length;
      }

      // Drag and drop
      taskListEls.forEach((list) => {
        list.addEventListener('dragover', (event) => {
          event.preventDefault();
          list.classList.add('drop-target');
        });

        list.addEventListener('dragleave', (event) => {
          const currentTarget = event.currentTarget;
          const nextTarget = event.relatedTarget;

          if (!nextTarget || !currentTarget.contains(nextTarget)) {
            currentTarget.classList.remove('drop-target');
          }
        });

        list.addEventListener('drop', (event) => {
          event.preventDefault();
          list.classList.remove('drop-target');

          if (!draggedTaskId) {
            return;
          }

          const targetStatus = list.dataset.status;
          const taskToMove = getTaskById(draggedTaskId);

          if (!taskToMove || taskToMove.status === targetStatus) {
            draggedTaskId = null;
            return;
          }

          updateTaskStatus(taskToMove.id, targetStatus);
          draggedTaskId = null;
        });
      });

      // Ações do modal
      addTaskBtn.addEventListener('click', openModal);
      closeModalBtn.addEventListener('click', closeModal);
      cancelTaskBtn.addEventListener('click', closeModal);

      modalEl.addEventListener('click', (event) => {
        if (event.target === modalEl) {
          closeModal();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && modalEl.classList.contains('open')) {
          closeModal();
        }
      });

      taskForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const title = taskTitleInput.value.trim();
        const description = taskDescriptionInput.value.trim();

        if (!title) {
          showTitleError('O título é obrigatório.');
          return;
        }

        const newTask = {
          id: createTaskId(),
          title: title,
          description: description,
          status: 'todo'
        };

        tasks.unshift(newTask);
        saveTasks();
        renderBoard();
        closeModal();
      });

      themeToggleBtn.addEventListener('click', () => {
        const nextTheme = themePreference === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
      });

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
        if (safeStorageGet(THEME_KEY) === null) {
          applyTheme(event.matches ? 'dark' : 'light');
        }
      });

      // Inicialização
      loadTasks();
      loadThemePreference();
      renderBoard();
    </script>
  </body>
</html>
